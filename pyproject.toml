[project]
name = "hknow-navigator"
version = "0.1.0"
description = "Healthcare Knowledge Navigator using Agentic RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = false
warn_unused_configs = true
disallow_untyped_defs = false